{% extends "base.html" %}
{% block title %}Add Student — SMS{% endblock %}

{% block content %}
<div class="page-header">
  <h1>➕ Add New Student</h1>
  <a href="{{ url_for('students') }}" class="btn-outline">← Back</a>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('add_student') }}">

    <!-- Personal Info -->
    <div class="form-section">
      <h3>📋 Personal Information</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="name" placeholder="e.g. Rahul Sharma" required/>
        </div>
        <div class="form-group">
          <label>Roll Number *</label>
          <input type="text" name="roll_no" placeholder="e.g. 101" required/>
        </div>
        <div class="form-group">
          <label>Branch / Department</label>
          <select name="branch">
            <option value="">-- Select Branch --</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Commerce</option>
            <option>Science</option>
            <option>Arts</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year</label>
          <select name="year">
            <option value="">-- Select Year --</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="student@email.com"/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="phone" placeholder="10-digit number" maxlength="10"/>
        </div>
      </div>
    </div>

    <!-- Marks -->
    <div class="form-section">
      <h3>📝 Marks (out of 100)</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Mathematics</label>
          <input type="number" name="math" min="0" max="100" value="0"/>
        </div>
        <div class="form-group">
          <label>Science</label>
          <input type="number" name="science" min="0" max="100" value="0"/>
        </div>
        <div class="form-group">
          <label>English</label>
          <input type="number" name="english" min="0" max="100" value="0"/>
        </div>
        <div class="form-group">
          <label>Computers</label>
          <input type="number" name="computers" min="0" max="100" value="0"/>
        </div>
        <div class="form-group">
          <label>Attendance (%)</label>
          <input type="number" name="attendance" min="0" max="100" value="0"/>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">✅ Add Student</button>
      <a href="{{ url_for('students') }}" class="btn-cancel">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
