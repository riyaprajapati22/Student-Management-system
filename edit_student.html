{% extends "base.html" %}
{% block title %}Edit {{ student.name }} — SMS{% endblock %}

{% block content %}
<div class="page-header">
  <h1>✏️ Edit Student</h1>
  <a href="{{ url_for('view_student', student_id=student.id) }}" class="btn-outline">← Back</a>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('edit_student', student_id=student.id) }}">

    <div class="form-section">
      <h3>📋 Personal Information</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="name" value="{{ student.name }}" required/>
        </div>
        <div class="form-group">
          <label>Roll Number *</label>
          <input type="text" name="roll_no" value="{{ student.roll_no }}" required/>
        </div>
        <div class="form-group">
          <label>Branch</label>
          <select name="branch">
            {% for b in ["Computer Science","Information Technology","Electronics","Mechanical","Civil","Commerce","Science","Arts"] %}
            <option {% if student.branch == b %}selected{% endif %}>{{ b }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Year</label>
          <select name="year">
            {% for y in ["1st Year","2nd Year","3rd Year","4th Year"] %}
            <option {% if student.year == y %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ student.email }}"/>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" value="{{ student.phone }}" maxlength="10"/>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>📝 Marks (out of 100)</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Mathematics</label>
          <input type="number" name="math" min="0" max="100" value="{{ student.math }}"/>
        </div>
        <div class="form-group">
          <label>Science</label>
          <input type="number" name="science" min="0" max="100" value="{{ student.science }}"/>
        </div>
        <div class="form-group">
          <label>English</label>
          <input type="number" name="english" min="0" max="100" value="{{ student.english }}"/>
        </div>
        <div class="form-group">
          <label>Computers</label>
          <input type="number" name="computers" min="0" max="100" value="{{ student.computers }}"/>
        </div>
        <div class="form-group">
          <label>Attendance (%)</label>
          <input type="number" name="attendance" min="0" max="100" value="{{ student.attendance }}"/>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">💾 Save Changes</button>
      <a href="{{ url_for('view_student', student_id=student.id) }}" class="btn-cancel">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
